apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:34
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: argocd
spec:
  selector: { app: echo }
  ports:
    - port: 80
      targetPort: 8080

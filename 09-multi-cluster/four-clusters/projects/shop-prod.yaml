# shop team, production: only the prod cluster, only shop-* namespaces, only the team's repos.
# Sync windows: when an allow window exists, syncs (manual and automatic) are only possible while it
# is open: Monday-Thursday 09:00-17:00 UTC. Emergencies: a platform admin adds a temporary window via Git.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shop-prod
  namespace: argocd
spec:
  description: shop team, production
  sourceRepos:
    - http://<git-host>/shop/*
  destinations:
    - { name: prod, namespace: "shop-*" }
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: networking.k8s.io, kind: NetworkPolicy }
  syncWindows:
    - kind: allow
      schedule: "0 9 * * 1-4"
      duration: 8h
      timeZone: UTC
      applications: ["*"]
      manualSync: false
    # Example change freeze: uncomment and set the dates.
    # - kind: deny
    #   schedule: "0 0 20 12 *"
    #   duration: 336h
    #   applications: ["*"]

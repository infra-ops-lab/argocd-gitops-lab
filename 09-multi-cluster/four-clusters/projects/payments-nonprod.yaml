# payments team, non-production: dev and staging, only payments-* namespaces, only the team's repos.
# No cluster-scoped resources, and no quotas/limits/network policies (those belong to the platform team).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments-nonprod
  namespace: argocd
spec:
  description: payments team, dev + staging
  sourceRepos:
    - http://<git-host>/payments/*
  destinations:
    - { name: dev, namespace: "payments-*" }
    - { name: staging, namespace: "payments-*" }
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: networking.k8s.io, kind: NetworkPolicy }
  roles:
    # A token for the team's CI: it may only sync this project's apps (argocd proj role create-token ...).
    - name: ci
      description: CI pipeline may refresh and sync non-prod apps
      policies:
        - p, proj:payments-nonprod:ci, applications, get, payments-nonprod/*, allow
        - p, proj:payments-nonprod:ci, applications, sync, payments-nonprod/*, allow

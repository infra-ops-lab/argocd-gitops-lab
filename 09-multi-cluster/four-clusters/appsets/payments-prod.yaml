# payments: every app folder x the prod cluster. No automated sync: a release manager presses Sync,
# and only inside the project's sync window. Deleting this ApplicationSet keeps the running apps.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels: { env: prod }
          - git:
              repoURL: http://<git-host>/payments/payments-deploy.git
              revision: main
              directories:
                - path: apps/*
  template:
    metadata:
      name: "payments-{{.path.basename}}-{{.name}}"
      labels: { team: payments, env: prod }
    spec:
      project: payments-prod
      source:
        repoURL: http://<git-host>/payments/payments-deploy.git
        targetRevision: main
        path: '{{.path.path}}/overlays/prod'
      destination:
        name: "{{.name}}"
        namespace: "payments-{{.path.basename}}"

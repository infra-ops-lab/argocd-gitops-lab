apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://<gitea-host>:<port>/<owner>/deploy-demo.git
    targetRevision: main
    path: kustomize/overlays/dev
  destination:
    name: edge-cluster
    namespace: hello-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

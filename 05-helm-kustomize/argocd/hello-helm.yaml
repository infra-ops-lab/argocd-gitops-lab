apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://<gitea-host>:<port>/<owner>/deploy-demo.git
    targetRevision: main
    path: helm/hello-web
    helm:
      valuesObject:
        replicas: 2
  destination:
    name: edge-cluster
    namespace: hello-helm
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
